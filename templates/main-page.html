<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplo - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="icon-list">
                <a href="/profile" aria-label="Profile" title="Profile" class="icon-link"><img src="{{ url_for('static', path='/img/icon-profile.svg') }}" alt="Profile" class="nav-icon"></a>
                <a href="/friends" aria-label="Friends" title="Friends" class="icon-link"><img src="{{ url_for('static', path='/img/icon-friend.svg') }}" alt="Friends" class="nav-icon"></a>

                <!-- Center logo: not hoverable / not linked -->
                <img src="{{ url_for('static', path='/img/icon-logo.svg') }}" alt="Logo" class="center-logo">

                <a href="/wardrobe" aria-label="Wardrobe" title="Wardrobe" class="icon-link"><img src="{{ url_for('static', path='/img/icon-wardrobe.svg') }}" alt="Wardrobe" class="nav-icon"></a>
                <a href="/settings" aria-label="Settings" title="Settings" class="icon-link"><img src="{{ url_for('static', path='/img/icon-settings.svg') }}" alt="Settings" class="nav-icon"></a>
            </div>
        </header>

        <section class="character-section">
            <div class="character-card">
                <img src="{{ url_for('static', path='/img/skins/squirrel-skins/standard-skin.svg') }}" alt="Your Squirrel" class="squirrel-img">
            </div>
            
            <div class="input-group">
                <input id="goal-input" type="text" placeholder="Type your goal" class="goal-input">
                <button id="btn-generate" class="btn-generate">Generate</button>
            </div>
        </section>

        <section class="quests-container">
            <h2 class="quests-title">YOUR QUESTS</h2>
            <div id="generation-status" class="generation-status" aria-live="polite" style="margin-bottom:8px;color:#f8b195;font-weight:600;"></div>
            <div id="quests-list" class="quests-list">
                <!-- Quests will be rendered here dynamically by JavaScript -->
            </div>
        </section>
    </div>

    <script>
        const USERNAME = "{{ username }}";
        async function renderTasksForGoal(goal) {
            const container = document.getElementById('quests-list');
            container.innerHTML = '<p>Generating tasks...</p>';

            try {
                const res = await fetch('/api/generate_tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ goal, username: USERNAME })
                });

                if (!res.ok) {
                    const err = await res.json().catch(()=>({error:'Unknown'}));
                    container.innerHTML = `<p class="error">Error: ${err.error || res.statusText}</p>`;
                    return;
                }

                const data = await res.json();
                console.log('generate_tasks response', data);
                // Show source (ai vs fallback) to aid debugging
                const statusEl = document.getElementById('generation-status');
                if (statusEl) statusEl.textContent = data.source ? `Generated by: ${data.source}` : '';
                const tasks = data.created || data.tasks || [];

                if (tasks.length === 0) {
                    container.innerHTML = '<p>No tasks generated.</p>';
                    return;
                }

                // Build group UI: a group card with tasks
                const groupEl = document.createElement('div');
                groupEl.className = 'group';

                const titleH = document.createElement('h3');
                const titleSpan = document.createElement('span');
                titleSpan.className = 'group-title';
                titleSpan.textContent = `Goal: ${goal}`;
                const chev = document.createElement('span');
                chev.className = 'chevron';
                chev.textContent = '▾';
                titleH.appendChild(titleSpan);
                titleH.appendChild(chev);

                const ul = document.createElement('ul');
                ul.className = 'tasks';

                for (const t of tasks) {
                    const li = document.createElement('li');

                    const left = document.createElement('div');
                    left.className = 'task-left';
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'task-title';
                    titleDiv.textContent = t.task || t.title || 'Task';
                    left.appendChild(titleDiv);

                    // If AI provided a description, show it under the title
                    if (t.description) {
                        const desc = document.createElement('div');
                        desc.className = 'task-desc';
                        desc.textContent = t.description;
                        left.appendChild(desc);
                    }

                    // If AI provided an attribute, display it
                    if (t.attribute) {
                        const attr = document.createElement('div');
                        attr.className = 'task-attr';
                        attr.textContent = t.attribute;
                        left.appendChild(attr);
                    }

                    const right = document.createElement('div');
                    right.className = 'task-right';
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    // Show base_reward (number of nuts) when available, otherwise fallback to complexity
                    const nuts = t.base_reward || t.complexity || 1;
                    badge.textContent = `+${nuts}`;
                    const acorn = document.createElement('span');
                    acorn.className = 'acorn';
                    acorn.textContent = '🥜';
                    right.appendChild(badge);
                    right.appendChild(acorn);

                    li.appendChild(left);
                    li.appendChild(right);
                        if (t.id) li.setAttribute('data-quest-id', t.id);
                        if (t.is_completed) titleDiv.classList.add('completed');
                        li.style.cursor = 'pointer';
                        li.addEventListener('click', async (ev) => {
                            // prevent double firing when clicking right-side buttons
                            if (ev.target.closest('.task-right')) return;
                            const newState = !(titleDiv.classList.contains('completed'));
                            // optimistic UI
                            if (newState) titleDiv.classList.add('completed'); else titleDiv.classList.remove('completed');
                            try {
                                const resp = await fetch(`/api/quest/${t.id}`, {
                                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ is_completed: newState })
                                });
                                if (!resp.ok) {
                                    // revert UI on failure
                                    if (newState) titleDiv.classList.remove('completed'); else titleDiv.classList.add('completed');
                                }
                            } catch (e) {
                                if (newState) titleDiv.classList.remove('completed'); else titleDiv.classList.add('completed');
                            }
                        });
                        ul.appendChild(li);
                }

                groupEl.appendChild(titleH);
                groupEl.appendChild(ul);
                container.innerHTML = '';
                container.appendChild(groupEl);
                // If tasks include deadlines/multipliers, render a small summary below the group
                try {
                    const anyWithConfigs = tasks.find(x => x.deadlines_config || x.multipliers_config);
                    if (anyWithConfigs) {
                        const cfgWrap = document.createElement('div');
                        cfgWrap.className = 'group-configs';
                        cfgWrap.style.marginTop = '8px';
                        for (const t of tasks) {
                            if (t.deadlines_config || t.multipliers_config) {
                                const row = document.createElement('div');
                                row.className = 'task-config-row';
                                const lbl = document.createElement('div'); lbl.className = 'task-config-title'; lbl.textContent = t.task || t.title || 'Task';
                                row.appendChild(lbl);
                                if (t.deadlines_config) {
                                    const dl = document.createElement('pre'); dl.className = 'small-pre'; dl.textContent = 'Deadlines: ' + JSON.stringify(t.deadlines_config);
                                    row.appendChild(dl);
                                }
                                if (t.multipliers_config) {
                                    const ml = document.createElement('pre'); ml.className = 'small-pre'; ml.textContent = 'Multipliers: ' + JSON.stringify(t.multipliers_config);
                                    row.appendChild(ml);
                                }
                                cfgWrap.appendChild(row);
                            }
                        }
                        container.appendChild(cfgWrap);
                    }
                } catch (e) {
                    // ignore
                }

            } catch (e) {
                container.innerHTML = `<p class="error">Network error: ${e.message}</p>`;
            }
        }
            // Load saved quests for the user on page load
            async function loadUserQuests() {
                if (!USERNAME) return;
                try {
                    const res = await fetch(`/api/quests/${USERNAME}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    const tasks = data.quests || [];
                    if (!tasks.length) return;
                    const container = document.getElementById('quests-list');

                    // Group quests by category
                    const groups = {};
                    for (const t of tasks) {
                        const cat = t.category || 'ungrouped';
                        if (!groups[cat]) groups[cat] = [];
                        groups[cat].push(t);
                    }

                    // Helper to create group element
                    function renderGroup(title, items) {
                        const groupEl = document.createElement('div');
                        groupEl.className = 'group';
                        const h = document.createElement('h3');
                        const span = document.createElement('span'); span.className = 'group-title'; span.textContent = title;
                        const chev = document.createElement('span'); chev.className = 'chevron'; chev.textContent = '▾';
                        h.appendChild(span); h.appendChild(chev);
                        const ul = document.createElement('ul'); ul.className = 'tasks';
                        for (const t of items) {
                            const li = document.createElement('li');
                            li.setAttribute('data-quest-id', t.id);
                            const left = document.createElement('div'); left.className = 'task-left';
                            const titleDiv = document.createElement('div'); titleDiv.className = 'task-title';
                            titleDiv.textContent = t.title || 'Task';
                            if (t.is_completed) titleDiv.classList.add('completed');
                            left.appendChild(titleDiv);
                            const right = document.createElement('div'); right.className = 'task-right';
                            const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = `+${t.base_reward || t.difficulty || 1}`;
                            const acorn = document.createElement('span'); acorn.className = 'acorn'; acorn.textContent = '🥜';
                            right.appendChild(badge); right.appendChild(acorn);
                            li.appendChild(left); li.appendChild(right);
                            li.style.cursor = 'pointer';
                            li.addEventListener('click', async (ev) => {
                                if (ev.target.closest('.task-right')) return;
                                const newState = !(titleDiv.classList.contains('completed'));
                                if (newState) titleDiv.classList.add('completed'); else titleDiv.classList.remove('completed');
                                try {
                                    const resp = await fetch(`/api/quest/${t.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ is_completed: newState }) });
                                    if (!resp.ok) {
                                        if (newState) titleDiv.classList.remove('completed'); else titleDiv.classList.add('completed');
                                    }
                                } catch (e) {
                                    if (newState) titleDiv.classList.remove('completed'); else titleDiv.classList.add('completed');
                                }
                            });
                            ul.appendChild(li);
                        }
                        groupEl.appendChild(h);
                        groupEl.appendChild(ul);
                        return groupEl;
                    }

                    // Render daily group first if exists
                    container.innerHTML = '';
                    if (groups['daily']) {
                        container.appendChild(renderGroup('Daily quests', groups['daily']));
                        delete groups['daily'];
                    }
                    // Render other groups (category string used as title)
                    for (const [cat, items] of Object.entries(groups)) {
                        const title = cat === 'ungrouped' ? 'Other quests' : cat;
                        container.appendChild(renderGroup(title, items));
                    }
                } catch (e) {
                    // ignore
                }
            }

            // Run initial load
            loadUserQuests();

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.getElementById('btn-generate').addEventListener('click', () => {
            const inputEl = document.getElementById('goal-input');
            const goal = inputEl.value.trim();
            if (!goal) return alert('Please enter a goal.');

            // Clear input immediately when Generate is pressed
            inputEl.value = '';
            inputEl.blur();

            renderTasksForGoal(goal);
        });
    </script>

</body>
</html>
